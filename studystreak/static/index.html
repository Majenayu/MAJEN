<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudyStreak</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #1b1b1b; }
  h1 { margin-bottom: .25rem; }
  .cards { display: flex; gap: 1rem; margin: 1rem 0; flex-wrap: wrap; }
  .card { flex: 1; min-width: 150px; border: 1px solid #ccc; border-radius: 8px; padding: .75rem 1rem; }
  .card strong { display: block; font-size: 1.6rem; }
  form { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: .5rem; align-items: end; }
  form .wide { grid-column: 1 / 3; }
  label { display: flex; flex-direction: column; font-size: .9rem; gap: .2rem; }
  input, button { font: inherit; padding: .45rem; }
  button { cursor: pointer; background: #5b2dd1; color: #fff; border: 0; border-radius: 6px; }
  button.del { background: #b00020; padding: .2rem .6rem; }
  button:focus-visible, input:focus-visible { outline: 3px solid #ffb000; outline-offset: 2px; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  th, td { text-align: left; padding: .4rem; border-bottom: 1px solid #ddd; }
  #msg { min-height: 1.4em; color: #b00020; }
  .bar { background: #5b2dd1; height: .6rem; border-radius: 3px; }
  form.goal { grid-template-columns: 2fr 1fr 1fr; margin-top: .5rem; }
  progress { width: 100%; height: 1rem; accent-color: #5b2dd1; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<main>
  <h1>StudyStreak</h1>
  <p>Log your study sessions and keep the streak alive.</p>

  <section class="cards" aria-label="Summary">
    <div class="card"><span>Streak</span><strong id="streak">0</strong>days</div>
    <div class="card"><span>Total</span><strong id="total">0</strong>minutes</div>
    <div class="card"><span>Sessions</span><strong id="count">0</strong>logged</div>
  </section>

  <h2>This week</h2>
  <p id="week-text">0 minutes this week (no goal set)</p>
  <progress id="week-progress" max="100" value="0" aria-labelledby="week-text" hidden></progress>
  <form id="goal" class="goal">
    <label>Weekly goal (minutes) <input name="minutes" type="number" min="1" max="10080"></label>
    <button type="submit">Set goal</button>
    <button type="button" id="clear-goal">Clear goal</button>
  </form>

  <h2>Log a session</h2>
  <form id="add">
    <label>Subject <input name="subject" required maxlength="60"></label>
    <label>Minutes <input name="minutes" type="number" min="1" max="1440" required></label>
    <label>Date <input name="date" type="date"></label>
    <label class="wide">Note <input name="note" maxlength="200"></label>
    <button type="submit">Add</button>
  </form>
  <p id="msg" role="alert" aria-live="polite"></p>

  <h2>By subject</h2>
  <table><thead><tr><th scope="col">Subject</th><th scope="col">Minutes</th><th scope="col" style="width:40%">Share</th></tr></thead>
    <tbody id="subjects"></tbody></table>

  <h2>Sessions</h2>
  <p><a href="/api/export.csv" download>Download all sessions as CSV</a></p>
  <table><thead><tr><th scope="col">Date</th><th scope="col">Subject</th><th scope="col">Minutes</th><th scope="col">Note</th><th scope="col"><span class="visually-hidden">Actions</span></th></tr></thead>
    <tbody id="sessions"></tbody></table>
</main>
<script>
  // All user text is rendered with textContent, never innerHTML.
  const $ = (id) => document.getElementById(id);
  const cell = (row, text) => { const td = document.createElement("td"); td.textContent = text; row.appendChild(td); return td; };

  async function api(method, path, body) {
    const res = await fetch(path, { method, headers: { "Content-Type": "application/json" },
                                    body: body ? JSON.stringify(body) : undefined });
    if (res.status === 204) return null;
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    return data;
  }

  async function refresh() {
    const [sessions, stats] = await Promise.all([api("GET", "/api/sessions"), api("GET", "/api/stats")]);
    $("streak").textContent = stats.streak;
    $("total").textContent = stats.total_minutes;
    $("count").textContent = stats.sessions;

    const wk = stats.week, bar = $("week-progress");
    if (wk.goal) {
      $("week-text").textContent = `${wk.minutes} of ${wk.goal} minutes this week (${wk.percent}%)`;
      bar.value = wk.percent; bar.hidden = false;
    } else {
      $("week-text").textContent = `${wk.minutes} minutes this week (no goal set)`;
      bar.hidden = true;
    }

    const subj = $("subjects"); subj.replaceChildren();
    const max = Math.max(1, ...stats.by_subject.map(e => e.minutes));
    for (const e of stats.by_subject) {
      const tr = document.createElement("tr");
      cell(tr, e.subject); cell(tr, e.minutes);
      const bar = document.createElement("div"); bar.className = "bar";
      bar.style.width = (100 * e.minutes / max) + "%";
      bar.setAttribute("aria-hidden", "true");
      cell(tr, "").appendChild(bar);
      subj.appendChild(tr);
    }

    const list = $("sessions"); list.replaceChildren();
    for (const s of sessions) {
      const tr = document.createElement("tr");
      cell(tr, s.date); cell(tr, s.subject); cell(tr, s.minutes); cell(tr, s.note);
      const btn = document.createElement("button");
      btn.className = "del"; btn.textContent = "Delete";
      btn.setAttribute("aria-label", `Delete ${s.subject} on ${s.date}`);
      btn.onclick = async () => { await api("DELETE", "/api/sessions/" + encodeURIComponent(s.id)); refresh(); };
      cell(tr, "").appendChild(btn);
      list.appendChild(tr);
    }
  }

  $("add").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const f = new FormData(ev.target);
    try {
      await api("POST", "/api/sessions", {
        subject: f.get("subject"), minutes: Number(f.get("minutes")),
        date: f.get("date") || null, note: f.get("note") });
      $("msg").textContent = "";
      ev.target.reset();
      refresh();
    } catch (err) { $("msg").textContent = err.message; }
  });

  async function setGoal(minutes) {
    try {
      await api("PUT", "/api/goal", { minutes });
      $("msg").textContent = "";
      $("goal").reset();
      refresh();
    } catch (err) { $("msg").textContent = err.message; }
  }
  $("goal").addEventListener("submit", (ev) => {
    ev.preventDefault();
    const v = new FormData(ev.target).get("minutes");
    if (!v) { $("msg").textContent = "Enter a goal in minutes, or use Clear goal."; return; }
    setGoal(Number(v));
  });
  $("clear-goal").addEventListener("click", () => setGoal(null));

  refresh().catch(err => { $("msg").textContent = err.message; });
</script>
</body>
</html>
